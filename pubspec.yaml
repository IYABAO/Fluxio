name: fluxio
description: "Fluxio - 横向多源信息流聚合器。添加任意网页 URL，横向滑动切换浏览多个信息源。"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 跨平台 WebView（Android/iOS/Windows）
  webview_flutter: ^4.10.0
  # 本地键值存储（源列表持久化）
  shared_preferences: ^2.3.0
  # 打开外部 URL（收藏历史中打开原文链接）
  url_launcher: ^6.3.0
  # HTTP 请求（从 URL 导入信息源）
  http: ^1.2.0
  webview_flutter_windows: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
