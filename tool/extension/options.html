<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Fluxio 收藏助手选项</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; max-width: 420px; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; color: #444; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px;
            box-sizing: border-box; font-size: 13px; }
    button { margin-top: 16px; padding: 8px 20px; border: 0; border-radius: 6px;
             background: #00897b; color: #fff; cursor: pointer; }
    #saved { color: #2e7d32; font-size: 13px; margin-top: 8px; min-height: 18px; }
    .tip { font-size: 12px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <h3>Fluxio 收藏助手配置</h3>
  <label for="host">收件服务地址</label>
  <input id="host" placeholder="http://127.0.0.1:8730" />
  <div class="tip">Fluxio 应用设置页显示实际端口（默认 8730）</div>

  <label for="token">收件 Token</label>
  <input id="token" placeholder="粘贴 Fluxio 设置页的 Token" />
  <div class="tip">在 Fluxio 设置 → 收件箱（Inbox）→ 复制 Token</div>

  <button id="save">保存</button>
  <div id="saved"></div>

  <script src="options.js"></script>
</body>
</html>
